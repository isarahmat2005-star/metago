<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIMATOR by IRS - AI Metadata Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">
    <div class="max-w-3xl mx-auto bg-gray-800 rounded-xl shadow-2xl overflow-hidden border border-gray-700">
        
        <div class="bg-gray-950 p-6 border-b border-gray-700 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                    ANIMATOR by IRS
                </h1>
                <p class="text-sm text-gray-400 mt-1">Microstock Metadata Generator</p>
            </div>
            <div id="googleLoginBtn" class="bg-white text-gray-900 px-4 py-2 rounded font-bold text-sm cursor-pointer hover:bg-gray-200 transition">
                <span class="flex items-center gap-2">
                    <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Login to Save Quota
                </span>
            </div>
        </div>

        <div class="p-6 space-y-6">
            <div class="space-y-2">
                <label class="block text-sm font-bold text-gray-300">Pilih Model Gemini AI:</label>
                <select id="modelSelect" class="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash (Cepat & Hemat Kuota)</option>
                    <option value="gemini-3.1-flash">Gemini 3.1 Flash (Terbaru, Kuota Lebih Besar)</option>
                    <option value="custom">⚙️ Custom Model (Ketik Sendiri)...</option>
                </select>
                <input type="text" id="customModelInput" placeholder="Contoh: gemini-4.0-pro" class="hidden w-full bg-gray-900 border border-gray-600 rounded p-3 mt-2 text-white focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-bold text-gray-300">Upload Konten (Gambar / Video / Vektor SVG):</label>
                <div class="border-2 border-dashed border-gray-600 rounded-lg p-6 text-center hover:bg-gray-700 transition relative">
                    <input type="file" id="fileInput" accept="image/*,video/*,.svg" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div class="text-gray-400">
                        <svg class="mx-auto h-12 w-12 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                        <p id="fileNameDisplay">Klik atau Drag & Drop file ke sini</p>
                    </div>
                </div>
                <canvas id="previewCanvas" class="hidden w-full max-h-64 object-contain rounded border border-gray-700 bg-black mt-4"></canvas>
                <img id="previewImage" class="hidden w-full max-h-64 object-contain rounded border border-gray-700 bg-black mt-4">
            </div>

            <button id="btnGenerate" class="w-full bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-500 hover:to-emerald-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transform transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                ✨ Generate Metadata Microstock
            </button>

            <div class="space-y-2">
                <label class="block text-sm font-bold text-gray-300">Hasil Metadata:</label>
                <div id="resultBox" class="w-full min-h-[150px] bg-gray-950 border border-gray-700 rounded p-4 text-emerald-400 font-mono text-sm whitespace-pre-wrap overflow-y-auto">Hasil akan muncul di sini...</div>
            </div>
        </div>
    </div>

    <script>
        // --- LOGIKA UI & PILIH MODEL ---
        const modelSelect = document.getElementById('modelSelect');
        const customModelInput = document.getElementById('customModelInput');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const btnGenerate = document.getElementById('btnGenerate');
        const resultBox = document.getElementById('resultBox');
        
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const previewImage = document.getElementById('previewImage');

        // Tampilkan input manual jika pilih "Custom"
        modelSelect.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                customModelInput.classList.remove('hidden');
                customModelInput.focus();
            } else {
                customModelInput.classList.add('hidden');
            }
        });

        // Tampilkan nama file saat dipilih
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileNameDisplay.innerText = `Terpilih: ${file.name}`;
            } else {
                fileNameDisplay.innerText = "Klik atau Drag & Drop file ke sini";
            }
        });

        // --- LOGIKA UTAMA GENERATE METADATA ---
        btnGenerate.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) return alert("Silakan pilih file terlebih dahulu!");

            // Menentukan model mana yang dipakai
            const selectedModel = modelSelect.value === 'custom' ? customModelInput.value : modelSelect.value;
            if (!selectedModel) return alert("Nama custom model tidak boleh kosong!");

            btnGenerate.disabled = true;
            btnGenerate.innerText = "⏳ Sedang Menganalisis Konten...";
            resultBox.innerText = "Memproses file dan menghubungi Gemini AI...\n(Menggunakan model: " + selectedModel + ")";
            resultBox.classList.replace('text-emerald-400', 'text-yellow-400');

            let base64Data = "";
            let mimeType = file.type;

            try {
                // 1. PROSES VIDEO (Ambil Frame ke-1 detik)
                if (file.type.includes('video')) {
                    previewImage.classList.add('hidden');
                    canvas.classList.remove('hidden');
                    
                    const video = document.createElement('video');
                    video.src = URL.createObjectURL(file);
                    await new Promise(r => video.onloadeddata = r);
                    video.currentTime = 1; 
                    await new Promise(r => video.onseeked = r);
                    
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0);
                    base64Data = canvas.toDataURL('image/jpeg').split(',')[1];
                    mimeType = "image/jpeg"; // Paksa jadi gambar agar AI mudah baca
                } 
                // 2. PROSES VEKTOR SVG ATAU GAMBAR BIASA
                else {
                    canvas.classList.add('hidden');
                    previewImage.classList.remove('hidden');
                    
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    await new Promise(r => reader.onload = r);
                    
                    previewImage.src = reader.result;
                    base64Data = reader.result.split(',')[1];
                }

                // 3. KIRIM KE BACKEND (generate.js)
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        fileData: base64Data, 
                        mimeType: mimeType,
                        requestedModel: selectedModel // Kirim model pilihan ke backend
                    })
                });

                const data = await res.json();
                
                resultBox.classList.replace('text-yellow-400', 'text-emerald-400');
                if(data.error) {
                    resultBox.classList.replace('text-emerald-400', 'text-red-400');
                    resultBox.innerText = "ERROR: " + data.error;
                } else {
                    resultBox.innerText = `[Model yang digunakan: ${data.usedModel || selectedModel}]\n\n${data.result}`;
                }

            } catch (error) {
                resultBox.classList.replace('text-yellow-400', 'text-red-400');
                resultBox.innerText = "Gagal menghubungi server: " + error.message;
            } finally {
                btnGenerate.disabled = false;
                btnGenerate.innerText = "✨ Generate Metadata Microstock";
            }
        };
    </script>
</body>
</html>
