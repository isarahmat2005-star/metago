<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METAGOTO by IRS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; }
        .dashed-border { border: 2px dashed #93c5fd; }
    </style>
</head>
<body class="text-gray-700 min-h-screen pb-10">

    <div class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div>
            <h1 class="text-3xl font-extrabold text-blue-600 tracking-tight">METAGOTO <span class="text-sm font-medium text-gray-500 tracking-normal ml-1">by IRS</span></h1>
        </div>
        <div class="flex items-center gap-6">
            <div class="text-right hidden sm:block">
                <div id="clockTime" class="text-lg font-bold text-gray-800 leading-tight">00:00:00</div>
                <div id="clockDate" class="text-xs text-gray-500">00/00/0000</div>
            </div>
            <button id="googleLoginBtn" onclick="handleAuthClick()" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-md font-semibold text-sm cursor-pointer hover:bg-gray-50 transition shadow-sm flex items-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                <span id="loginText">Sign In Google</span>
            </button>
        </div>
    </div>

    <div class="max-w-4xl mx-auto mt-6 px-4">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-slate-50 border-b border-gray-200 px-6 py-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">METADATA SETTINGS</h2>
            </div>

            <div class="p-6 space-y-6">
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-semibold text-gray-500 uppercase">AI Model Platform</label>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <select id="modelSelect" class="w-full bg-white border border-gray-300 rounded-md p-2.5 text-sm text-gray-700 outline-none">
                            <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash (Recommended)</option>
                            <option value="gemini-3.1-flash">Gemini 3.1 Flash (High Accuracy)</option>
                            <option value="custom">⚙️ Custom Model...</option>
                        </select>
                        <input type="text" id="customModelInput" placeholder="Enter custom model (e.g., gemini-4.0)" class="hidden w-full bg-white border border-gray-300 rounded-md p-2.5 text-sm text-gray-700 outline-none">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-semibold text-gray-500 uppercase">Source Type</label>
                    </div>
                    <div class="dashed-border bg-blue-50/30 rounded-lg p-8 text-center hover:bg-blue-50 transition relative cursor-pointer">
                        <input type="file" id="fileInput" accept="image/*,video/*,.svg" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <div class="text-blue-600 flex flex-col items-center justify-center">
                            <svg class="h-8 w-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            <span id="fileNameDisplay" class="text-sm font-semibold uppercase tracking-wide">UPLOAD ASSETS</span>
                            <span class="text-xs text-gray-400 mt-1 font-normal">JPG, PNG, WEBP, MP4, MOV, SVG</span>
                        </div>
                    </div>
                    <canvas id="previewCanvas" class="hidden w-full max-h-48 object-contain rounded border border-gray-200 bg-gray-50 mt-4"></canvas>
                    <img id="previewImage" class="hidden w-full max-h-48 object-contain rounded border border-gray-200 bg-gray-50 mt-4">
                </div>

                <div class="grid grid-cols-3 gap-4 pt-4 border-t border-gray-100">
                    <div class="bg-blue-50 rounded-md p-3 text-center border border-blue-100"><div class="text-xs text-blue-500 font-semibold mb-1">Selected</div><div class="text-lg font-bold text-blue-700" id="statusSelected">0</div></div>
                    <div class="bg-green-50 rounded-md p-3 text-center border border-green-100"><div class="text-xs text-green-600 font-semibold mb-1">Completed</div><div class="text-lg font-bold text-green-700" id="statusCompleted">0</div></div>
                    <div class="bg-red-50 rounded-md p-3 text-center border border-red-100"><div class="text-xs text-red-500 font-semibold mb-1">Failed</div><div class="text-lg font-bold text-red-700" id="statusFailed">0</div></div>
                </div>

                <div class="flex gap-3">
                    <button id="btnGenerate" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md shadow-sm transition flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                        GENERATE METADATA
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-6">
            <div id="resultBox" class="w-full min-h-[150px] bg-white border border-gray-200 rounded-xl p-5 text-gray-700 font-mono text-sm shadow-sm whitespace-pre-wrap">Hasil metadata akan muncul di sini...</div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. SISTEM LOGIN GOOGLE (OAUTH 2.0)
        // ==========================================
        let tokenClient;
        let userAccessToken = null; 

        // PERHATIAN: Ganti teks di bawah dengan Client ID dari Google Cloud Console Anda!
        const GOOGLE_CLIENT_ID = "151782765319-5klk78b5lqrcnaaqqu7k0mqiqhbmonf1.apps.googleusercontent.com"; 

        window.onload = function () {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                // Meminta izin untuk menggunakan platform Generative AI
                scope: 'https://www.googleapis.com/auth/generative-language.retriever',
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        userAccessToken = tokenResponse.access_token;
                        
                        // Ubah tampilan tombol jadi hijau kalau berhasil
                        const btnText = document.getElementById('loginText');
                        const btn = document.getElementById('googleLoginBtn');
                        btnText.innerText = "🟢 Connected (Saving Quota)";
                        btn.classList.replace('text-gray-700', 'text-green-700');
                        btn.classList.replace('border-gray-300', 'border-green-300');
                        btn.classList.replace('bg-white', 'bg-green-50');
                        
                        alert("Login Berhasil! Sekarang Anda menggunakan kuota dari email ini.");
                    }
                },
            });
            updateClock();
        };

        function handleAuthClick() {
            // Memicu popup login Google
            tokenClient.requestAccessToken();
        }

        // ==========================================
        // 2. LOGIKA UI & GENERATE METADATA
        // ==========================================
        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('clockDate').innerText = now.toLocaleDateString('id-ID');
        }
        setInterval(updateClock, 1000);

        const modelSelect = document.getElementById('modelSelect');
        const customModelInput = document.getElementById('customModelInput');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const btnGenerate = document.getElementById('btnGenerate');
        const resultBox = document.getElementById('resultBox');
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const previewImage = document.getElementById('previewImage');
        const statusSelected = document.getElementById('statusSelected');
        const statusCompleted = document.getElementById('statusCompleted');
        const statusFailed = document.getElementById('statusFailed');

        modelSelect.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                customModelInput.classList.remove('hidden');
                customModelInput.focus();
            } else {
                customModelInput.classList.add('hidden');
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileNameDisplay.innerText = file.name;
                statusSelected.innerText = "1";
            } else {
                fileNameDisplay.innerText = "UPLOAD ASSETS";
                statusSelected.innerText = "0";
            }
        });

        btnGenerate.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) return alert("Silakan pilih file terlebih dahulu!");

            const selectedModel = modelSelect.value === 'custom' ? customModelInput.value : modelSelect.value;
            if (!selectedModel) return alert("Nama custom model tidak boleh kosong!");

            btnGenerate.disabled = true;
            btnGenerate.innerHTML = `PROCESSING...`;
            resultBox.innerText = "Menganalisis file...\nModel: " + selectedModel;
            resultBox.classList.add('text-blue-500');

            let base64Data = "";
            let mimeType = file.type;

            try {
                if (file.type.includes('video')) {
                    previewImage.classList.add('hidden');
                    canvas.classList.remove('hidden');
                    const video = document.createElement('video');
                    video.src = URL.createObjectURL(file);
                    await new Promise(r => video.onloadeddata = r);
                    video.currentTime = 1; 
                    await new Promise(r => video.onseeked = r);
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0);
                    base64Data = canvas.toDataURL('image/jpeg').split(',')[1];
                    mimeType = "image/jpeg";
                } else {
                    canvas.classList.add('hidden');
                    previewImage.classList.remove('hidden');
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    await new Promise(r => reader.onload = r);
                    previewImage.src = reader.result;
                    base64Data = reader.result.split(',')[1];
                }

                // Kirim data dan accessToken (jika ada) ke backend Vercel
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        fileData: base64Data, 
                        mimeType: mimeType,
                        requestedModel: selectedModel,
                        accessToken: userAccessToken // Mengirim kunci rahasia dari login Google!
                    })
                });

                const data = await res.json();
                
                if(data.error) throw new Error(data.error);
                
                resultBox.classList.replace('text-blue-500', 'text-gray-800');
                resultBox.innerText = `[Model: ${data.usedModel || selectedModel}]\n\n${data.result}`;
                statusCompleted.innerText = parseInt(statusCompleted.innerText) + 1;

            } catch (error) {
                resultBox.classList.replace('text-blue-500', 'text-red-500');
                resultBox.innerText = "Gagal memproses: " + error.message;
                statusFailed.innerText = parseInt(statusFailed.innerText) + 1;
            } finally {
                btnGenerate.disabled = false;
                btnGenerate.innerHTML = `GENERATE METADATA`;
            }
        };
    </script>
</body>
</html>
